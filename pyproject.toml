[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "liuyao-chart"
version = "0.1.0"
description = "Deterministic Liuyao (六爻) hexagram casting and chart assembly, outputting versioned JSON"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["liuyao", "iching", "divination", "hexagram", "najia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Religion",
]
dependencies = [
    "lunar-python>=1.3",
    "pydantic>=2",
    "tzdata; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/suanqiu-oss/liuyao-chart"
Source = "https://github.com/suanqiu-oss/liuyao-chart"
Issues = "https://github.com/suanqiu-oss/liuyao-chart/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liuyao_chart = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
